<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="Amber v0.1 — the first release of Amber by Dawnstone."
  />

  <meta name="theme-color" content="#030811" />

  <meta
    property="og:title"
    content="Amber v0.1 — Dawnstone"
  />

  <meta
    property="og:description"
    content="The first release of Amber by Dawnstone."
  />

  <meta property="og:type" content="website" />

  <title>Amber v0.1 — Dawnstone</title>

  <link rel="icon" type="image/png" href="../../assets/favicon.png">

  <style>
    :root {
      --night-top: #030811;
      --night-bottom: #071526;

      --gold: #FFDEA3;
      --orange: #F58F4B;

      --white: #F5F7FB;
      --muted: rgba(245,247,251,0.58);

      --nav-bg: rgba(255,255,255,0.05);
      --nav-border: rgba(255,255,255,0.12);

      --card-bg: rgba(255,255,255,0.045);
      --card-border: rgba(255,255,255,0.11);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      color: var(--white);

      background:
        linear-gradient(
          180deg,
          var(--night-top) 0%,
          var(--night-bottom) 100%
        );

      line-height: 1.7;

      overflow-x: hidden;
    }

    ::selection {
      background: rgba(255,222,163,0.85);
      color: #030811;
    }

    a {
      color: inherit;
    }

    a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .display {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-weight: 600;
      letter-spacing: -0.04em;
    }

    .serif {
      font-family:
        "New York",
        "Iowan Old Style",
        "Apple Garamond",
        Georgia,
        "Times New Roman",
        serif;

      font-style: italic;
      font-weight: 400;
    }


    /* =========================================================
       Background
       ========================================================= */

    .sky {
      position: fixed;
      inset: 0;

      z-index: -10;

      overflow: hidden;
      pointer-events: none;

      background:
        radial-gradient(
          100% 60% at 50% 25%,
          rgba(245,143,75,0.09),
          transparent 65%
        ),
        linear-gradient(
          180deg,
          var(--night-top),
          var(--night-bottom)
        );
    }

    .glow {
      position: absolute;

      left: 50%;
      top: 10%;

      width: 55vw;
      height: 55vw;

      max-width: 820px;
      max-height: 820px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,222,163,0.18) 0%,
          rgba(245,143,75,0.08) 34%,
          transparent 70%
        );

      filter: blur(24px);
    }

    .stars {
      position: absolute;

      width: 1px;
      height: 1px;

      left: 0;
      top: 0;

      opacity: 0.85;
    }


    /* =========================================================
       Navigation
       ========================================================= */

    .nav-wrap {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 50;

      display: flex;
      justify-content: center;

      padding: 1rem;
    }

    @media (min-width: 640px) {
      .nav-wrap {
        padding-top: 1.5rem;
      }
    }

    .nav {
      width: 100%;
      max-width: 64rem;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0.75rem 1.25rem;

      border-radius: 9999px;

      background: var(--nav-bg);

      border:
        0.5px solid
        var(--nav-border);

      backdrop-filter:
        blur(40px)
        saturate(150%);

      -webkit-backdrop-filter:
        blur(40px)
        saturate(150%);

      box-shadow:
        0 8px 40px rgba(0,0,0,0.35);
    }

    @media (min-width: 640px) {
      .nav {
        padding: 0.875rem 1.75rem;
      }
    }

    .brand {
      font-size: 0.875rem;
      font-weight: 600;

      letter-spacing: 0.22em;

      text-decoration: none;
    }

    @media (min-width: 640px) {
      .brand {
        font-size: 1rem;
      }
    }

    .nav-back {
      display: inline-flex;

      align-items: center;

      gap: 0.65rem;

      font-size: 11px;

      letter-spacing: 0.12em;

      text-transform: uppercase;

      text-decoration: none;

      color:
        rgba(245,247,251,0.65);

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    .nav-back:hover {
      color: var(--white);

      transform: translateX(3px);
    }


    /* =========================================================
       Main
       ========================================================= */

    main {
      position: relative;
      z-index: 1;
    }

    .release {
      min-height: 100svh;

      display: flex;
      flex-direction: column;

      justify-content: center;

      padding:
        9rem 1.5rem
        7rem;
    }

    @media (min-width: 640px) {
      .release {
        padding:
          10rem 3rem
          8rem;
      }
    }

    @media (min-width: 768px) {
      .release {
        padding:
          11rem 5rem
          9rem;
      }
    }

    @media (min-width: 1024px) {
      .release {
        padding-left: 10rem;
        padding-right: 10rem;
      }
    }

    .release-inner {
      width: 100%;
      max-width: 70rem;

      margin: 0 auto;
    }


    /* =========================================================
       Eyebrow
       ========================================================= */

    .eyebrow {
      display: flex;

      align-items: center;

      gap: 0.8rem;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.3em;

      color:
        rgba(245,247,251,0.48);
    }

    .eyebrow .dot {
      width: 5px;
      height: 5px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--orange);

      box-shadow:
        0 0 18px
        rgba(245,143,75,0.7);
    }


    /* =========================================================
       Heading
       ========================================================= */

    .release-title {
      max-width: 62rem;

      margin-top: 1.8rem;

      font-size:
        clamp(
          4rem,
          11vw,
          9.5rem
        );

      line-height: 0.9;

      letter-spacing: -0.06em;
    }

    .release-title .accent {
      color: var(--gold);
    }

    .release-description {
      max-width: 42rem;

      margin-top: 2.25rem;

      font-size:
        clamp(
          1.2rem,
          2.8vw,
          1.7rem
        );

      line-height: 1.4;

      color:
        rgba(245,247,251,0.68);
    }


    /* =========================================================
       Release Meta
       ========================================================= */

    .release-meta {
      display: flex;

      flex-wrap: wrap;

      gap: 1rem 1.5rem;

      margin-top: 2.5rem;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 0.2em;

      color:
        rgba(245,247,251,0.4);
    }

    .release-meta span + span {
      position: relative;

      padding-left: 1.5rem;
    }

    .release-meta span + span::before {
      content: "";

      position: absolute;

      left: 0;
      top: 50%;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background:
        rgba(245,247,251,0.3);

      transform: translateY(-50%);
    }


    /* =========================================================
       Download Card
       ========================================================= */

    .download-card {
      width: 100%;
      max-width: 48rem;

      margin-top: 4rem;

      padding: 1.25rem;

      border-radius: 2rem;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.025)
        );

      border:
        0.5px solid
        var(--card-border);

      backdrop-filter:
        blur(32px)
        saturate(140%);

      -webkit-backdrop-filter:
        blur(32px)
        saturate(140%);

      box-shadow:
        0 30px 80px rgba(0,0,0,0.28);
    }

    @media (min-width: 640px) {
      .download-card {
        padding: 1.5rem;
      }
    }

    .download-card-top {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 1rem;
    }

    .release-info {
      min-width: 0;
    }

    .release-name {
      font-size: 1.15rem;

      font-weight: 600;

      letter-spacing: -0.02em;
    }

    .release-file {
      margin-top: 0.25rem;

      font-size: 11px;

      letter-spacing: 0.08em;

      color:
        rgba(245,247,251,0.4);

      word-break: break-word;
    }

    .release-number {
      flex: 0 0 auto;

      padding:
        0.45rem
        0.75rem;

      border-radius: 999px;

      background:
        rgba(255,222,163,0.08);

      border:
        1px solid
        rgba(255,222,163,0.16);

      color:
        rgba(255,222,163,0.88);

      font-size: 10px;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    .download-button {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 0.75rem;

      width: 100%;

      margin-top: 1.25rem;

      padding:
        1rem
        1.25rem;

      border-radius: 1.15rem;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--orange)
        );

      color: #16100a;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 0.14em;

      text-transform: uppercase;

      text-decoration: none;

      box-shadow:
        0 12px 35px
        rgba(245,143,75,0.2);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        filter 0.3s ease;
    }

    .download-button:hover {
      transform: translateY(-2px);

      filter: brightness(1.06);

      box-shadow:
        0 18px 45px
        rgba(245,143,75,0.3);
    }

    .download-button:active {
      transform: translateY(0);
    }

    .download-arrow {
      font-size: 15px;

      line-height: 1;
    }


    /* =========================================================
       Releases Link
       ========================================================= */

    .releases-link {
      display: inline-flex;

      align-items: center;

      gap: 0.7rem;

      margin-top: 2rem;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.2em;

      color:
        rgba(245,247,251,0.48);

      text-decoration: none;

      transition:
        color 0.3s ease,
        transform 0.3s ease;
    }

    .releases-link:hover {
      color: var(--white);

      transform: translateX(3px);
    }

    .releases-link .arrow {
      color: var(--gold);
    }


    /* =========================================================
       Divider
       ========================================================= */

    .divider {
      width: 100%;
      max-width: 70rem;

      margin: 0 auto;

      padding:
        0 1.5rem;
    }

    @media (min-width: 640px) {
      .divider {
        padding: 0 3rem;
      }
    }

    @media (min-width: 768px) {
      .divider {
        padding: 0 5rem;
      }
    }

    @media (min-width: 1024px) {
      .divider {
        padding:
          0 10rem;
      }
    }

    .divider::after {
      content: "";

      display: block;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,0.12),
          transparent
        );
    }


    /* =========================================================
       Footer
       ========================================================= */

    .footer {
      padding:
        2rem 1.5rem
        2.5rem;
    }

    @media (min-width: 640px) {
      .footer {
        padding:
          2rem 3rem
          2.5rem;
      }
    }

    @media (min-width: 768px) {
      .footer {
        padding:
          2rem 5rem
          2.5rem;
      }
    }

    @media (min-width: 1024px) {
      .footer {
        padding-left: 10rem;
        padding-right: 10rem;
      }
    }

    .footer-inner {
      max-width: 70rem;

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 1.5rem;
    }

    .footer-brand {
      font-size: 11px;

      letter-spacing: 0.22em;

      text-decoration: none;

      color:
        rgba(245,247,251,0.55);
    }

    .footer-note {
      font-size: 10px;

      letter-spacing: 0.08em;

      color:
        rgba(245,247,251,0.32);
    }


    /* =========================================================
       Reveal
       ========================================================= */

    .reveal {
      opacity: 0;

      transform:
        translateY(22px);

      filter:
        blur(10px);

      transition:
        opacity 1s
          cubic-bezier(.23,1,.32,1),
        transform 1s
          cubic-bezier(.23,1,.32,1),
        filter 1s
          cubic-bezier(.23,1,.32,1);
    }

    .reveal.in {
      opacity: 1;

      transform: none;

      filter: blur(0);
    }


    /* =========================================================
       Responsive
       ========================================================= */

    @media (max-width: 639px) {

      .nav-back span:first-child {
        display: none;
      }

      .release {
        min-height: 92svh;
      }

      .download-card-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .release-number {
        align-self: flex-start;
      }

      .footer-inner {
        align-items: flex-start;

        flex-direction: column;
      }

    }


    /* =========================================================
       Reduced Motion
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      .reveal {
        opacity: 1;

        transform: none;

        filter: none;

        transition: none;
      }

      .download-button,
      .releases-link {
        transition: none;
      }

    }
  </style>
</head>

<body>

  <!-- =========================================================
       BACKGROUND
       ========================================================= -->

  <div class="sky" aria-hidden="true">
    <div class="glow"></div>
    <div class="stars" id="stars"></div>
  </div>


  <!-- =========================================================
       NAVIGATION
       ========================================================= -->

  <div class="nav-wrap">

    <nav class="nav" aria-label="Primary">

      <a
        href="../../index.html"
        class="brand display"
      >
        DAWNSTONE
      </a>

      <a
        href="../../releases.html"
        class="nav-back"
      >
        <span>Releases</span>
        <span> </span>
      </a>

    </nav>

  </div>


  <!-- =========================================================
       RELEASE
       ========================================================= -->

  <main>

    <section class="release">

      <div class="release-inner">

        <div class="eyebrow reveal">

          <span class="dot"></span>

          <span>
            Release / Amber / 001
          </span>

        </div>


        <h1 class="release-title display reveal">

          Amber
          <span class="serif accent">
            v0.1.
          </span>

        </h1>


        <p class="release-description reveal">

          The first release of Amber.
          A quiet music player for the Mac,
          built by Dawnstone.

        </p>


        <div class="release-meta reveal">

          <span>
            August 2026
          </span>

          <span>
            Amber
          </span>

          <span>
            v0.1
          </span>

        </div>


        <!-- ===================================================
             Download
             =================================================== -->

        <div class="download-card reveal">

          <div class="download-card-top">

            <div class="release-info">

              <div class="release-name">
                Amber v0.1
              </div>

              <div class="release-file">
                amber-v-0-1.zip
              </div>

            </div>

            <div class="release-number">
              Release 001
            </div>

          </div>


          <a
            href="/releases/amber/amber-v-0-1.zip"
            class="download-button"
            download
          >

            <span>
              Download Amber v0.1
            </span>

            <span class="download-arrow">
              ↓
            </span>

          </a>

        </div>


        <a
          href="../../releases.html"
          class="releases-link reveal"
        >

          <span>
            See our releases
          </span>

          <span class="arrow">
             
          </span>

        </a>

      </div>

    </section>


    <div class="divider"></div>

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer class="footer">

    <div class="footer-inner">

      <a
        href="../../index.html"
        class="footer-brand display"
      >
        DAWNSTONE
      </a>

      <p class="footer-note">
        Amber / Release 001
      </p>

    </div>

  </footer>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>
    (function () {

      var reduce =
        window.matchMedia &&
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;


      /* =======================================================
         Stars
         ======================================================= */

      (function () {

        var count =
          reduce
            ? 60
            : 130;

        var shadows = [];

        for (var i = 0; i < count; i++) {

          var x =
            (Math.random() * 100)
              .toFixed(2);

          var y =
            (Math.random() * 70)
              .toFixed(2);

          var opacity =
            (Math.random() * 0.55 + 0.15)
              .toFixed(2);

          var size =
            Math.random() > 0.94
              ? 1.5
              : 0.8;

          shadows.push(
            x +
            "vw " +
            y +
            "vh 0 " +
            size +
            "px rgba(245,247,251," +
            opacity +
            ")"
          );

        }

        document
          .getElementById("stars")
          .style.boxShadow =
          shadows.join(", ");

      })();


      /* =======================================================
         Reveal
         ======================================================= */

      (function () {

        var elements =
          document.querySelectorAll(
            ".reveal"
          );

        if (reduce) {

          elements.forEach(
            function (element) {

              element.classList.add(
                "in"
              );

            }
          );

          return;
        }

        var observer =
          new IntersectionObserver(
            function (entries) {

              entries.forEach(
                function (entry) {

                  if (
                    entry.isIntersecting
                  ) {

                    entry.target.classList.add(
                      "in"
                    );

                    observer.unobserve(
                      entry.target
                    );

                  }

                }
              );

            },
            {
              threshold: 0.12,
              rootMargin:
                "0px 0px -8% 0px"
            }
          );

        elements.forEach(
          function (element) {

            observer.observe(
              element
            );

          }
        );

      })();


      /* =======================================================
         Background movement
         ======================================================= */

      var ticking = false;

      function updateBackground() {

        var max =
          document.documentElement
            .scrollHeight -
          window.innerHeight;

        var progress =
          max > 0
            ? Math.min(
                1,
                Math.max(
                  0,
                  window.scrollY / max
                )
              )
            : 0;

        var glow =
          0.17 -
          progress * 0.1;

        document
          .querySelector(".glow")
          .style.opacity =
          Math.max(
            0.04,
            glow
          );

        document
          .getElementById("stars")
          .style.transform =
          reduce
            ? "none"
            : "translateY(" +
              progress * 80 +
              "px)";

        ticking = false;

      }


      function onScroll() {

        if (!ticking) {

          ticking = true;

          requestAnimationFrame(
            updateBackground
          );

        }

      }


      window.addEventListener(
        "scroll",
        onScroll,
        {
          passive: true
        }
      );

      window.addEventListener(
        "resize",
        onScroll
      );

      updateBackground();

    })();
  </script>

</body>
</html>
